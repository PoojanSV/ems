<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<title>EMS – Employee Management System</title>
<style>
:root{--brand:#4338ca;--brand2:#06b6d4;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--bg:#f3f5fb;--ok:#059669;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(135deg,var(--brand),#0e7490);color:#fff}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;flex:none}.logo.xl{width:84px;height:84px}
.word{font-weight:800;letter-spacing:.14em;font-size:19px}
.tag{font-size:11px;font-weight:700;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:99px;letter-spacing:.05em}
.who{display:flex;align-items:center;gap:10px;font-size:13px;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.wrap{max-width:520px;margin:0 auto;padding:16px}.wrap.wide{max-width:1000px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
h3{margin:0 0 10px;font-size:16px}
label,.lbl{display:block;margin:10px 0 4px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--brand2);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:12px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));cursor:pointer;text-align:center}
.btn.sec{background:#eef2ff;color:var(--brand)}
.btn.bad{background:linear-gradient(135deg,#dc2626,#f97316)}
.btn.xs{min-height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.6}
.btn.sec .spin{border-color:#c7d2fe;border-top-color:var(--brand)}
.bigbtn{width:100%;min-height:60px;font-size:18px;margin-bottom:14px;border-radius:16px}
.link{background:none;border:0;color:var(--brand);font:inherit;font-weight:600;margin-top:12px;cursor:pointer;width:100%}
.stack{display:grid;gap:10px;margin-top:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mute)}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
.spin.dark{border-color:#c7d2fe;border-top-color:var(--brand)}.spin.big{width:36px;height:36px}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center;padding:16px}
.empty{padding:16px;text-align:center;color:var(--mute)}
.mute{color:var(--mute)}.small{font-size:12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.alert{padding:12px;border-radius:12px;font-size:14px}.alert.bad{background:#fee2e2;color:#991b1b}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#e2e8f0;color:#475569}
.pill.ok{background:#d1fae5;color:#047857}.pill.bad{background:#fee2e2;color:#b91c1c}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:22px;padding:26px;box-shadow:0 20px 50px rgba(67,56,202,.15)}
.login .brand{flex-direction:column;text-align:center;margin-bottom:10px}
.login .word{font-size:30px;background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--mute);font-size:13px}
.hero{text-align:center;padding:22px}
.hero .big{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0}
.hrow{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}.r{text-align:right}
.tabs{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:99px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}
.tabs button.on{background:#eef2ff;color:var(--brand)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:8px}
td{padding:10px 8px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.th{width:34px;height:34px;border-radius:8px;object-fit:cover;margin-right:4px;vertical-align:middle;cursor:pointer}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(15,23,42,.55);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}.overlay.mid{align-items:center}
.sheetbox{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.mid .sheetbox{border-radius:18px;margin:16px;width:calc(100% - 32px)}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.x{border:0;background:#f1f5f9;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
#imgv img{max-width:92vw;max-height:85vh;border-radius:14px}
.cam{position:relative;width:260px;height:260px;margin:8px auto;border-radius:50%;overflow:hidden;background:#0f172a;border:4px solid #e0e7ff}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.shot{width:220px;height:220px;object-fit:cover;border-radius:50%;display:block;margin:8px auto;border:4px solid #e0e7ff}
.pin-in{text-align:center;font-size:30px;letter-spacing:.4em;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1}.toast.bad{background:#b91c1c}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="emsg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>
  <symbol id="ems-logo" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="16" fill="url(#emsg)"/>
    <path d="M32 9C23.2 9 16 15.9 16 24.5c0 11.2 12.6 24.1 15 26.4.6.6 1.4.6 2 0 2.4-2.3 15-15.2 15-26.4C48 15.9 40.8 9 32 9z" fill="#fff"/>
    <circle cx="32" cy="24.5" r="9.5" fill="url(#emsg)"/>
    <path d="M32 18.8v5.9l4.2 2.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<main id="v-load"><div class="center" style="padding-top:40vh"><span class="spin dark big"></span></div></main>

<main id="v-login" class="login hidden">
  <div class="login-card">
    <div class="brand"><svg class="logo xl"><use href="#ems-logo"/></svg><div class="word">EMS</div><div class="sub">Employee Management System</div></div>
    <form id="loginForm">
      <label for="email">Email</label><input id="email" type="email" required autocomplete="username">
      <label for="pass">Password</label><input id="pass" type="password" required autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button class="btn" id="loginBtn" type="submit" style="width:100%;margin-top:8px">Sign in</button>
    </form>
    <button class="link" id="forgot" type="button">Forgot password?</button>
  </div>
</main>

<div id="v-emp" class="hidden">
  <header class="top">
    <div class="brand"><svg class="logo"><use href="#ems-logo"/></svg><div class="word">EMS</div></div>
    <div class="who"><span id="empName"></span><button class="btn xs sec" id="logoutE">Sign out</button></div>
  </header>
  <div class="wrap">
    <div class="card hero" id="empStatus"></div>
    <button id="punchBtn" class="btn bigbtn">Clock In</button>
    <div class="stats"><div class="stat"><b id="statToday">0h 00m</b><span>Today</span></div><div class="stat"><b id="statMonth">0h 00m</b><span>This month</span></div></div>
    <div class="card"><h3>Recent shifts</h3><div id="hist"></div></div>
  </div>
</div>

<div id="v-admin" class="hidden">
  <header class="top">
    <div class="brand"><svg class="logo"><use href="#ems-logo"/></svg><div class="word">EMS</div><span class="tag">ADMIN</span></div>
    <div class="who"><span id="admName"></span><button class="btn xs sec" id="logoutA">Sign out</button></div>
  </header>
  <nav class="tabs" id="tabs"><button data-tab="today">Today</button><button data-tab="reports">Reports</button><button data-tab="team">Team</button><button data-tab="office">Office</button></nav>
  <div class="wrap wide" id="adminBody"></div>
</div>

<div id="sheet" class="overlay"><div class="sheetbox"><div class="sheethead"><b id="sheetTitle"></b><button class="x" id="sheetX" type="button">✕</button></div><div id="sheetBody"></div></div></div>
<div id="dlg" class="overlay mid"><div class="sheetbox"><b id="dlgT"></b><div id="dlgB"></div><div class="stack"><button class="btn" id="dlgOk" type="button">OK</button><button class="btn sec" id="dlgNo" type="button">Cancel</button></div></div></div>
<div id="imgv" class="overlay mid"><img id="imgvImg" alt="Selfie"></div>
<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
'use strict';
/* ====== 1. PASTE YOUR FIREBASE WEB CONFIG HERE (see SETUP-GUIDE.md) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyA54Vz_46paWinrnIk4Pxjv8OD5Hi9MXFI",
  authDomain: "ems-45c2c.firebaseapp.com",
  projectId: "ems-45c2c",
  storageBucket: "ems-45c2c.firebasestorage.app",
  messagingSenderId: "432371886956",
  appId: "1:432371886956:web:14f3628ea215a940972149",
  measurementId: "G-PDJN7GNNPS"
};
/* ======================================================================= */
if(typeof firebase==='undefined'||firebaseConfig.apiKey.indexOf('YOUR_')===0){
  document.body.innerHTML='<div style="padding:28px;font:16px/1.5 system-ui"><h2>EMS setup needed</h2><p>'+(typeof firebase==='undefined'?'Could not load Firebase. Check your internet connection.':'Open <b>index.html</b> and paste your Firebase web-app config into <code>firebaseConfig</code> (see SETUP-GUIDE.md).')+'</p></div>';
  return;
}
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
db.settings({experimentalAutoDetectLongPolling:true,merge:true});
const FV=firebase.firestore.FieldValue, TS=firebase.firestore.Timestamp;

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const dt=t=>t&&t.toDate?t.toDate():null;
const fT=d=>d?d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'—';
const fD=d=>d?d.toLocaleDateString([], {day:'2-digit',month:'short',year:'numeric'}):'—';
const hm=m=>Math.floor(m/60)+'h '+p2(m%60)+'m';
const sameDay=(a,b)=>a.toDateString()===b.toDateString();
const mins=s=>{const a=dt(s.inAt);if(!a)return 0;const b=dt(s.outAt)||new Date();return Math.max(0,Math.floor((b-a)/60000));};
const money=n=>'₹'+(Math.round(n*100)/100).toFixed(2);
function dist(a,b,c,d){const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));}
function getPos(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no({code:0});navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||0}),no,{enableHighAccuracy:true,timeout:20000,maximumAge:0});});}
const geoMsg=e=>e&&e.code===1?'Location permission is blocked. Turn on location and allow it for this app.':e&&e.code===3?'Location timed out. Move to an open area and try again.':'Could not get your location. Make sure GPS / location is switched on.';
function authMsg(e){const m={'auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'Wrong email or password.','auth/invalid-email':'Enter a valid email address.','auth/too-many-requests':'Too many attempts. Try again later.','auth/network-request-failed':'No internet connection.','auth/email-already-in-use':'That email already has an account.','auth/weak-password':'Password must be at least 6 characters.','auth/user-disabled':'This account is disabled.'};return m[e&&e.code]||('Something went wrong'+(e&&e.code?' ('+e.code+')':'')+'.');}
let tt;
function toast(m,bad){const t=$('toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');clearTimeout(tt);tt=setTimeout(()=>{t.className='toast';},3400);}
async function busy(btn,fn){if(btn.disabled)return;const o=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>';try{return await fn();}finally{btn.disabled=false;btn.innerHTML=o;}}
function view(id){['v-load','v-login','v-emp','v-admin'].forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0);}
function viewImg(src){$('imgvImg').src=src;$('imgv').classList.add('open');}
$('imgv').onclick=()=>$('imgv').classList.remove('open');
document.addEventListener('click',e=>{const i=e.target.closest&&e.target.closest('img.th');if(i)viewImg(i.src);});
function dlg(title,html,ok,danger){return new Promise(res=>{$('dlgT').textContent=title;$('dlgB').innerHTML=html;const o=$('dlgOk');o.textContent=ok||'OK';o.className='btn'+(danger?' bad':'');$('dlg').classList.add('open');const done=v=>{$('dlg').classList.remove('open');o.onclick=null;$('dlgNo').onclick=null;res(v);};o.onclick=()=>done(true);$('dlgNo').onclick=()=>done(false);});}

/* ---------- state ---------- */
let me=null,ticker=null,stream=null,stepId=0,P=null;
let E={shifts:[],open:null,cfg:null};
let A={users:[],cfg:null,tab:'today',rid:0};

function stopCam(){if(stream){stream.getTracks().forEach(x=>x.stop());stream=null;}}
function cleanup(){clearInterval(ticker);ticker=null;stopCam();P=null;stepId++;$('sheet').classList.remove('open');$('dlg').classList.remove('open');}

/* ---------- login / routing ---------- */
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('loginErr').textContent='';
  await busy($('loginBtn'),async()=>{try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value);}catch(err){$('loginErr').textContent=authMsg(err);}});
});
$('forgot').addEventListener('click',async()=>{
  const em=$('email').value.trim();
  if(!em){$('loginErr').textContent='Type your email above first.';return;}
  try{await auth.sendPasswordResetEmail(em);toast('Password reset email sent');}catch(err){$('loginErr').textContent=authMsg(err);}
});
$('logoutE').onclick=$('logoutA').onclick=()=>auth.signOut();
async function deny(msg){try{await auth.signOut();}catch(e){}view('v-login');$('loginErr').textContent=msg;}
let gen=0;
auth.onAuthStateChanged(async u=>{
  const g=++gen;cleanup();
  if(!u){me=null;view('v-login');return;}
  view('v-load');
  try{
    const s=await db.collection('users').doc(u.uid).get();
    if(g!==gen)return;
    if(!s.exists)return deny('No EMS profile exists for this login. Ask your admin.');
    me=Object.assign({uid:u.uid},s.data());
    if(me.active!==true)return deny('Your account is disabled. Contact your admin.');
    if(me.role==='admin')await initAdmin();
    else if(me.role==='employee')await initEmp();
    else return deny('This login is for the PIN app. Open the EMS PIN app instead.');
  }catch(e){if(g===gen)deny('Could not load your profile ('+(e.code||e.message)+'). Check internet and Firestore rules.');}
});

/* =====================================================================
   EMPLOYEE
   ===================================================================== */
async function initEmp(){
  E={shifts:[],open:null,cfg:null};
  $('empName').textContent=me.name||me.email;
  const o=await db.collection('settings').doc('office').get();
  E.cfg=o.exists?o.data():null;
  await loadEmp();
  view('v-emp');
  ticker=setInterval(tick,1000);
}
async function loadEmp(){
  const q=await db.collection('users').doc(me.uid).collection('shifts').orderBy('inAt','desc').limit(100).get();
  E.shifts=q.docs.map(d=>Object.assign({id:d.id},d.data()));
  E.open=E.shifts.find(s=>!s.outAt&&s.inAt)||null;
  renderEmp();
}
function renderEmp(){
  const now=new Date(),o=E.open;let today=0,month=0;
  E.shifts.forEach(s=>{const a=dt(s.inAt);if(!a)return;const m=mins(s);if(sameDay(a,now))today+=m;if(a.getMonth()===now.getMonth()&&a.getFullYear()===now.getFullYear())month+=m;});
  $('empStatus').innerHTML=o
    ?'<span class="pill ok">On shift</span><div class="big" id="runT">0:00:00</div><div class="mute">Since '+fT(dt(o.inAt))+', '+fD(dt(o.inAt))+'</div>'
    :'<span class="pill">Off shift</span><div class="big">—</div><div class="mute">Tap Clock In when you arrive</div>';
  const b=$('punchBtn');b.textContent=o?'Clock Out':'Clock In';b.className='btn bigbtn'+(o?' bad':'');
  $('statToday').textContent=hm(today);$('statMonth').textContent=hm(month);
  $('hist').innerHTML=E.shifts.slice(0,30).map(s=>{const a=dt(s.inAt);return '<div class="hrow"><div><b>'+fD(a)+'</b><div class="mute small">'+fT(a)+' → '+(s.outAt?fT(dt(s.outAt)):'running')+'</div></div><div class="r"><b>'+hm(mins(s))+'</b><div class="mute small">'+esc(s.inMethod||'')+(s.outMethod?' / '+esc(s.outMethod):'')+'</div></div></div>';}).join('')||'<div class="empty">No shifts yet</div>';
  tick();
}
function tick(){
  const o=E.open,el=$('runT');if(!o||!el)return;
  const a=dt(o.inAt);if(!a)return;
  const s=Math.max(0,Math.floor((Date.now()-a.getTime())/1000));
  el.textContent=Math.floor(s/3600)+':'+p2(Math.floor(s/60)%60)+':'+p2(s%60);
}

/* ---- punch flow: location -> (PIN) -> selfie -> confirm ---- */
$('punchBtn').addEventListener('click',()=>openPunch(E.open?'out':'in'));
$('sheetX').onclick=()=>{if(P&&P.busy)return;closeSheet();};
function openPunch(a){P={a,method:null,pos:null,pin:'',selfie:null,busy:false,requested:false};$('sheet').classList.add('open');stepLoc();}
function closeSheet(){stopCam();P=null;stepId++;$('sheet').classList.remove('open');}
const sb=h=>{stepId++;$('sheetBody').innerHTML=h;return stepId;};
const title=(t,n)=>{$('sheetTitle').textContent=(t.a==='in'?'Clock in':'Clock out')+' · Step '+n+' of 2';};

async function stepLoc(){
  const t=P;title(t,1);stopCam();
  const sid=sb('<div class="center"><span class="spin dark big"></span><p>Checking your location…</p></div>');
  const live=()=>P===t&&sid===stepId,c=E.cfg;
  let p;
  try{p=await getPos();}catch(e){if(live()){t.pos=null;locFail(geoMsg(e));}return;}
  if(!live())return;
  t.pos=p;
  if(!c||typeof c.lat!=='number'||typeof c.lng!=='number'||typeof c.radius!=='number'){p.dist=null;return locFail('Your admin has not set the office location yet.');}
  p.dist=dist(p.lat,p.lng,c.lat,c.lng);
  if(p.dist<=c.radius){t.method='gps';return stepCam();}
  locFail('You are about '+Math.round(p.dist)+' m from '+esc(c.name||'the office')+' (allowed: '+c.radius+' m).');
}
function locFail(msg){
  const t=P;if(!t)return;t.method=null;title(t,1);
  sb('<div class="alert bad">'+msg+'</div><div class="stack"><button class="btn sec" id="retryLoc">Retry location</button><button class="btn" id="usePin">Use a PIN instead</button></div><p class="mute small center">On site but GPS is not accurate? Request a one-time PIN. It is shown on the office PIN display.</p>');
  $('retryLoc').onclick=stepLoc;$('usePin').onclick=()=>stepPin();
}
function stepPin(msg){
  const t=P;if(!t)return;title(t,1);
  if(!t.requested){
    sb('<p class="center">Your PIN will be shown next to your name on the <b>office PIN display</b>. Tap the button, then read it there.</p><div class="err center" id="pinErr"></div><div class="stack"><button class="btn" id="reqPin">Request PIN</button><button class="btn sec" id="pinBack">Back</button></div>');
    $('pinErr').textContent=msg||'';
    $('reqPin').onclick=e=>reqPin(e.currentTarget);
  }else{
    sb('<p class="center small mute">Find <b>'+esc(me.name||'your name')+'</b> on the office PIN display and type the 6-digit PIN. It is valid for 1 minute.</p><input id="pinIn" class="pin-in" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••"><div class="err center" id="pinErr"></div><div class="stack"><button class="btn" id="pinGo">Continue</button><button class="btn sec" id="reqPin">Request a new PIN</button><button class="btn sec" id="pinBack">Back</button></div>');
    $('pinErr').textContent=msg||'';
    $('pinIn').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);};
    $('pinGo').onclick=()=>{const v=$('pinIn').value;if(!/^\d{6}$/.test(v)){$('pinErr').textContent='Enter all 6 digits.';return;}t.method='pin';t.pin=v;stepCam();};
    $('reqPin').onclick=e=>reqPin(e.currentTarget);
  }
  $('pinBack').onclick=()=>{t.method=null;t.requested=false;stepLoc();};
}
async function reqPin(btn){
  const t=P;if(!t)return;
  await busy(btn,async()=>{
    try{await db.collection('pins').doc(me.uid).set({empName:me.name,requestedAt:FV.serverTimestamp()});}
    catch(e){const pe=P===t?$('pinErr'):null;if(pe)pe.textContent='Could not request a PIN ('+(e.code||'network')+'). Try again.';return;}
    if(P!==t)return;
    t.requested=true;toast('PIN requested. Look at the office display.');stepPin();
  });
}
async function stepCam(){
  const t=P;if(!t)return;title(t,2);
  const sid=sb('<div class="cam"><video id="vid" playsinline muted autoplay></video></div><p class="mute center small" id="camHint">Face the camera, then tap Take selfie.</p><div class="stack"><button class="btn" id="snap">Take selfie</button><label class="btn sec hidden" id="pickWrap">Use photo picker<input type="file" id="pick" accept="image/*" capture="user" hidden></label><button class="btn sec" id="camBack">Back</button></div>');
  const live=()=>P===t&&sid===stepId;
  $('camBack').onclick=()=>{stopCam();if(t.method==='pin')stepPin();else stepLoc();};
  $('snap').onclick=()=>{const v=$('vid');if(!v||!v.videoWidth){toast('Camera is not ready yet',true);return;}grab(t,v,v.videoWidth,v.videoHeight);};
  $('pick').onchange=e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const u=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);if(live())grab(t,im,im.naturalWidth,im.naturalHeight);};
    im.onerror=()=>{URL.revokeObjectURL(u);toast('Could not read that photo',true);};
    im.src=u;
  };
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:640}},audio:false});
    if(!live()){s.getTracks().forEach(x=>x.stop());return;}
    stream=s;const v=$('vid');v.srcObject=s;await v.play().catch(()=>{});
  }catch(e){
    if(!live())return;
    $('camHint').textContent='Camera unavailable. Use the photo picker instead.';
    $('pickWrap').classList.remove('hidden');$('snap').disabled=true;
  }
}
function grab(t,src,w,h){
  if(!w||!h||P!==t)return;
  const s=Math.min(1,360/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  t.selfie=c.toDataURL('image/jpeg',0.6);stopCam();stepReview();
}
function stepReview(){
  const t=P;if(!t)return;title(t,2);
  const where=t.method==='gps'?'<span class="pill ok">Location verified · '+Math.round(t.pos.dist)+' m from office</span>':'<span class="pill">PIN verification</span>';
  sb('<img class="shot" src="'+t.selfie+'" alt="Your selfie"><p class="center">'+where+'</p><div class="err center" id="subErr"></div><div class="stack"><button class="btn'+(t.a==='out'?' bad':'')+'" id="sub">Confirm '+(t.a==='in'?'clock in':'clock out')+'</button><button class="btn sec" id="retake">Retake selfie</button></div>');
  $('sub').onclick=e=>submit(e.currentTarget);$('retake').onclick=()=>stepCam();
}
async function submit(btn){
  const t=P;if(!t||t.busy||!t.selfie)return;
  t.busy=true;
  await busy(btn,async()=>{
    const k=t.a,ts=FV.serverTimestamp(),d={},pos=t.pos;
    d[k+'At']=ts;d[k+'Method']=t.method;d[k+'Selfie']=t.selfie;
    if(pos){d[k+'Lat']=pos.lat;d[k+'Lng']=pos.lng;d[k+'Acc']=Math.round(pos.acc);if(typeof pos.dist==='number')d[k+'Dist']=Math.round(pos.dist);}
    const col=db.collection('users').doc(me.uid).collection('shifts'),b=db.batch();
    if(t.method==='pin')b.update(db.collection('pins').doc(me.uid),{used:true,usedAt:ts,attempt:t.pin});
    if(k==='in')b.set(col.doc(),d);else b.update(col.doc(E.open.id),d);
    try{await b.commit();}
    catch(e){
      t.busy=false;
      if(P!==t)return;
      if(e.code==='permission-denied'){
        if(t.method==='pin')stepPin('That PIN is wrong, expired or already used. Request a new one.');
        else locFail('The server did not accept your location. Move closer to the office or use a PIN.');
      }else{const se=$('subErr');if(se)se.textContent='Could not save ('+(e.code||'network')+'). Check your connection and try again.';}
      return;
    }
    toast(k==='in'?'Clocked in ✓':'Clocked out ✓');closeSheet();
    try{await loadEmp();}catch(e){toast('Saved, but could not refresh. Pull to reload.',true);}
  });
  t.busy=false;
}

/* =====================================================================
   ADMIN
   ===================================================================== */
async function initAdmin(){
  A={users:[],cfg:null,tab:'today',rid:0};
  $('admName').textContent=me.name||me.email;
  await loadUsers();
  const o=await db.collection('settings').doc('office').get();
  A.cfg=o.exists?o.data():null;
  view('v-admin');setTab('today');
}
async function loadUsers(){
  const q=await db.collection('users').get();
  A.users=q.docs.map(d=>Object.assign({uid:d.id},d.data())).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
}
const body=h=>{$('adminBody').innerHTML=h;};
const loading='<div class="center"><span class="spin dark big"></span></div>';
function setTab(t){
  A.tab=t;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  const fn={today:tabToday,reports:tabReports,team:tabTeam,office:tabOffice}[t];
  Promise.resolve().then(fn).catch(e=>body('<div class="alert bad">Error: '+esc(e.code||e.message)+'</div>'));
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab);});

async function empShifts(uid,lim){
  const q=await db.collection('users').doc(uid).collection('shifts').orderBy('inAt','desc').limit(lim).get();
  return q.docs.map(d=>Object.assign({id:d.id},d.data()));
}
async function tabToday(){
  const rid=++A.rid;body(loading);
  const emps=A.users.filter(u=>u.role==='employee'&&u.active===true);
  const res=await Promise.all(emps.map(async u=>({u,sh:await empShifts(u.uid,8)})));
  if(rid!==A.rid)return;
  const now=new Date();let on=0,seen=0;
  const rows=res.map(({u,sh})=>{
    const open=sh.find(s=>!s.outAt&&s.inAt),td=sh.filter(s=>{const a=dt(s.inAt);return a&&sameDay(a,now);});
    const tm=td.reduce((x,s)=>x+mins(s),0);
    if(open)on++;if(open||td.length)seen++;
    const st=open?'<span class="pill ok">On shift</span>':td.length?'<span class="pill">Done</span>':'<span class="pill bad">Not in</span>';
    const inT=open?fT(dt(open.inAt)):td.length?fT(dt(td[td.length-1].inAt)):'—';
    return '<tr><td><b>'+esc(u.name)+'</b></td><td>'+st+'</td><td>'+inT+'</td><td>'+hm(tm)+'</td></tr>';
  }).join('');
  body('<div class="stats"><div class="stat"><b>'+emps.length+'</b><span>Employees</span></div><div class="stat"><b>'+on+'</b><span>On shift now</span></div><div class="stat"><b>'+(emps.length-seen)+'</b><span>Not in today</span></div></div>'
    +'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Today</h3><button class="btn xs sec" data-act="refresh">Refresh</button></div><div class="tbl-wrap"><table><thead><tr><th>Employee</th><th>Status</th><th>In</th><th>Hours today</th></tr></thead><tbody>'
    +(rows||'<tr><td colspan="4" class="empty">No employees yet. Add them in the Team tab.</td></tr>')+'</tbody></table></div></div>');
}

function tabReports(){
  A.rid++;
  const n=new Date(),f=new Date(n.getFullYear(),n.getMonth(),1);
  const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  body('<div class="card"><div class="fgrid"><div><label>From</label><input type="date" id="rf" value="'+iso(f)+'"></div><div><label>To</label><input type="date" id="rtt" value="'+iso(n)+'"></div><div><label>Employee</label><select id="re"><option value="">All employees</option>'
    +A.users.filter(u=>u.role==='employee').map(u=>'<option value="'+esc(u.uid)+'">'+esc(u.name)+'</option>').join('')
    +'</select></div></div><div class="stack"><button class="btn" data-act="load">Load report</button></div></div><div id="repOut"></div>');
}
async function loadReport(){
  const f=$('rf').value,t=$('rtt').value,who=$('re').value;
  if(!f||!t||f>t){toast('Choose a valid date range',true);return;}
  const from=new Date(f+'T00:00:00'),to=new Date(t+'T00:00:00');to.setDate(to.getDate()+1);
  const list=A.users.filter(u=>u.role==='employee'&&(!who||u.uid===who));
  const res=await Promise.all(list.map(async u=>{
    const q=await db.collection('users').doc(u.uid).collection('shifts').where('inAt','>=',TS.fromDate(from)).where('inAt','<',TS.fromDate(to)).orderBy('inAt','desc').get();
    return q.docs.map(d=>Object.assign({id:d.id,u},d.data()));
  }));
  const rows=[].concat(...res).sort((a,b)=>dt(b.inAt)-dt(a.inAt));
  const tot={};rows.forEach(s=>{const o=tot[s.u.uid]||(tot[s.u.uid]={u:s.u,m:0,n:0});o.m+=mins(s);o.n++;});
  const sum=Object.keys(tot).map(k=>tot[k]).sort((a,b)=>String(a.u.name).localeCompare(String(b.u.name)));
  let gm=0,gp=0;
  const srows=sum.map(x=>{const p=x.m/60*(Number(x.u.hourlyRate)||0);gm+=x.m;gp+=p;return '<tr><td><b>'+esc(x.u.name)+'</b></td><td>'+x.n+'</td><td><b>'+hm(x.m)+'</b></td><td>'+money(Number(x.u.hourlyRate)||0)+'/h</td><td><b>'+money(p)+'</b></td></tr>';}).join('');
  const th=s=>typeof s==='string'&&s.indexOf('data:image/')===0?'<img class="th" alt="selfie" src="'+esc(s)+'">':'';
  const drows=rows.map(s=>{
    const a=dt(s.inAt);
    const meth=esc(s.inMethod||'')+(typeof s.inDist==='number'&&s.inMethod==='pin'?' ('+s.inDist+'m)':'')+(s.outMethod?' / '+esc(s.outMethod)+(typeof s.outDist==='number'&&s.outMethod==='pin'?' ('+s.outDist+'m)':''):'');
    return '<tr><td>'+fD(a)+'</td><td>'+esc(s.u.name)+'</td><td>'+fT(a)+'</td><td>'+(s.outAt?fT(dt(s.outAt)):'<span class="pill ok">Open</span>')+'</td><td><b>'+hm(mins(s))+'</b></td><td>'+meth+'</td><td>'+th(s.inSelfie)+th(s.outSelfie)+'</td><td>'
      +(s.outAt?'':'<button class="btn xs sec" data-act="close" data-u="'+esc(s.u.uid)+'" data-s="'+esc(s.id)+'">Close</button> ')
      +'<button class="btn xs bad" data-act="del" data-u="'+esc(s.u.uid)+'" data-s="'+esc(s.id)+'">Delete</button></td></tr>';
  }).join('');
  $('repOut').innerHTML='<div class="card"><h3>Hours &amp; pay summary</h3><div class="tbl-wrap"><table><thead><tr><th>Employee</th><th>Shifts</th><th>Total time</th><th>Rate</th><th>Pay</th></tr></thead><tbody>'
    +(srows||'<tr><td colspan="5" class="empty">No shifts in this range</td></tr>')
    +(srows?'<tr><td><b>Total</b></td><td></td><td><b>'+hm(gm)+'</b></td><td></td><td><b>'+money(gp)+'</b></td></tr>':'')
    +'</tbody></table></div><p class="mute small">Pay uses each employee\'s current hourly rate. Time is counted in whole minutes.</p></div>'
    +'<div class="card"><h3>Shift details</h3><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Employee</th><th>In</th><th>Out</th><th>Duration</th><th>Method</th><th>Selfies</th><th></th></tr></thead><tbody>'
    +(drows||'<tr><td colspan="8" class="empty">Nothing to show</td></tr>')+'</tbody></table></div></div>';
}

function tabTeam(){
  A.rid++;
  const rows=A.users.map(u=>'<tr><td><b>'+esc(u.name)+'</b><div class="mute small">'+esc(u.email)+'</div></td><td>'+esc(u.role)+'</td><td>'+(u.role==='employee'?money(Number(u.hourlyRate)||0)+'/h':'—')+'</td><td>'+(u.active===true?'<span class="pill ok">Active</span>':'<span class="pill bad">Disabled</span>')+'</td><td>'
    +'<button class="btn xs sec" data-act="edit" data-u="'+esc(u.uid)+'">Edit</button> '
    +(u.uid!==me.uid?'<button class="btn xs '+(u.active===true?'bad':'sec')+'" data-act="toggle" data-u="'+esc(u.uid)+'">'+(u.active===true?'Disable':'Enable')+'</button> ':'')
    +'<button class="btn xs sec" data-act="reset" data-u="'+esc(u.uid)+'">Reset password</button></td></tr>').join('');
  body('<div class="card"><h3>Add team member</h3><div class="fgrid"><div><label>Full name</label><input id="nn"></div><div><label>Email</label><input id="ne" type="email"></div><div><label>Temporary password</label><input id="np" type="text" autocomplete="off"></div>'
    +'<div><label>Role</label><select id="nr"><option value="employee">Employee</option><option value="pin">PIN display (office phone)</option><option value="admin">Admin</option></select></div><div><label>Hourly rate (₹)</label><input id="nh" type="number" min="0" step="0.01" value="0"></div></div>'
    +'<div class="stack"><button class="btn" data-act="add">Create account</button></div></div>'
    +'<div class="card"><h3>Team</h3><div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Rate</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>');
}
async function addUser(btn){
  const name=$('nn').value.trim(),email=$('ne').value.trim().toLowerCase(),pw=$('np').value,role=$('nr').value,rate=parseFloat($('nh').value);
  if(!name||!email||pw.length<6||!(rate>=0)){toast('Enter name, email, a password (6+ characters) and a valid rate',true);return;}
  await busy(btn,async()=>{
    let uid;
    try{
      const app=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(firebaseConfig,'sec');
      const cr=await app.auth().createUserWithEmailAndPassword(email,pw);
      uid=cr.user.uid;await app.auth().signOut();
    }catch(e){toast(authMsg(e),true);return;}
    try{await db.collection('users').doc(uid).set({name,email,role,active:true,hourlyRate:rate,createdAt:FV.serverTimestamp()});}
    catch(e){toast('Login created but profile failed: '+(e.code||e.message),true);return;}
    toast('Account created for '+name);await loadUsers();tabTeam();
  });
}
async function editUser(id){
  const u=A.users.find(x=>x.uid===id);if(!u)return;
  const ok=await dlg('Edit '+u.name,'<label>Full name</label><input id="edN" value="'+esc(u.name)+'"><label>Role</label><select id="edR"'+(id===me.uid?' disabled':'')+'>'+['employee','pin','admin'].map(r=>'<option value="'+r+'"'+(u.role===r?' selected':'')+'>'+r+'</option>').join('')+'</select><label>Hourly rate (₹)</label><input id="edH" type="number" min="0" step="0.01" value="'+(Number(u.hourlyRate)||0)+'">','Save');
  if(!ok)return;
  const n=$('edN').value.trim(),h=parseFloat($('edH').value);
  if(!n||!(h>=0)){toast('Invalid values',true);return;}
  await db.collection('users').doc(id).update({name:n,role:id===me.uid?u.role:$('edR').value,hourlyRate:h});
  toast('Saved');await loadUsers();tabTeam();
}
async function toggleUser(id){
  const u=A.users.find(x=>x.uid===id);if(!u||id===me.uid)return;
  const on=u.active===true;
  const ok=await dlg((on?'Disable ':'Enable ')+u.name+'?',on?'<p>They will no longer be able to sign in or clock in.</p>':'<p>They will be able to sign in again.</p>',on?'Disable':'Enable',on);
  if(!ok)return;
  await db.collection('users').doc(id).update({active:!on});
  toast(on?'Disabled':'Enabled');await loadUsers();tabTeam();
}
function tabOffice(){
  A.rid++;const c=A.cfg||{};
  const nv=v=>typeof v==='number'?v:'';
  body('<div class="card"><h3>Office location</h3><p class="mute">Employees can clock in with GPS only inside this radius. Stand at the office and tap “Use my current location”.</p><label>Office name</label><input id="on" value="'+esc(c.name||'')+'">'
    +'<div class="fgrid"><div><label>Latitude</label><input id="ola" type="number" step="any" value="'+nv(c.lat)+'"></div><div><label>Longitude</label><input id="olo" type="number" step="any" value="'+nv(c.lng)+'"></div></div>'
    +'<label>Allowed radius (metres)</label><input id="orad" type="number" min="20" max="5000" value="'+(typeof c.radius==='number'?c.radius:100)+'">'
    +'<div class="stack"><button class="btn sec" data-act="here">Use my current location</button><button class="btn" data-act="saveoff">Save office</button></div></div>');
}
async function saveOffice(btn){
  const lat=parseFloat($('ola').value),lng=parseFloat($('olo').value),rad=parseInt($('orad').value,10),nm=$('on').value.trim()||'Office';
  if(!(lat>=-90&&lat<=90)||!(lng>=-180&&lng<=180)||!(rad>=20&&rad<=5000)){toast('Enter a valid latitude, longitude and a radius of 20–5000 m',true);return;}
  const latDelta=rad/111000*1.1,lngDelta=rad/(111000*Math.max(0.01,Math.cos(lat*Math.PI/180)))*1.1;
  await busy(btn,async()=>{
    const d={name:nm,lat,lng,radius:rad,latDelta,lngDelta,updatedAt:FV.serverTimestamp()};
    await db.collection('settings').doc('office').set(d);
    A.cfg={name:nm,lat,lng,radius:rad,latDelta,lngDelta};toast('Office saved ✓');
  });
}

$('adminBody').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,u=b.dataset.u,s=b.dataset.s;
  try{
    if(a==='refresh')setTab(A.tab);
    else if(a==='load')await busy(b,loadReport);
    else if(a==='add')await addUser(b);
    else if(a==='edit')await editUser(u);
    else if(a==='toggle')await toggleUser(u);
    else if(a==='reset'){const x=A.users.find(z=>z.uid===u);if(x){await auth.sendPasswordResetEmail(x.email);toast('Reset email sent to '+x.email);}}
    else if(a==='saveoff')await saveOffice(b);
    else if(a==='here')await busy(b,async()=>{try{const p=await getPos();$('ola').value=p.lat.toFixed(6);$('olo').value=p.lng.toFixed(6);toast('Location filled in');}catch(er){toast(geoMsg(er),true);}});
    else if(a==='close'){
      if(!await dlg('Close this shift?','<p>The shift will end now and be marked as closed by admin.</p>','Close shift'))return;
      await db.collection('users').doc(u).collection('shifts').doc(s).update({outAt:FV.serverTimestamp(),outMethod:'admin'});
      toast('Shift closed');await loadReport();
    }else if(a==='del'){
      if(!await dlg('Delete this shift?','<p>This cannot be undone.</p>','Delete',true))return;
      await db.collection('users').doc(u).collection('shifts').doc(s).delete();
      toast('Shift deleted');await loadReport();
    }
  }catch(err){toast('Error: '+(err.code||err.message),true);}
});
})();
